<!DOCTYPE html>
<html data-theme="dark" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/css/output.css">
    <link rel="icon" type="image/png" href="public/image/favicon.png">
    <title>گلینو - لاگین</title>
</head>
<body class="bg-mist-50 dark:bg-zinc-800 mb-10">
  <section class="flex items-center justify-center -mt-6">
    <img class="w-60" src="public/image/logo.png" alt="">
  </section>
<section class="container relative flex items-center justify-center -mt-5">
  <div class="w-80 sx:w-93 h-26 rounded-2xl bg-primary absolute -top-4"></div>
  <div class="bg-white dark:bg-zinc-700 w-70 sx:w-85 font-iranyekan rounded-2xl z-50">
    <aside class="*:pt-5 flex flex-col items-center">
      <h1 class="font-bold leading-8 dark:text-white text-222223 text-xl">ورود به حساب کاربری</h1>
      <p class="dont-regester dark:text-zinc-300 text-4E4E4E text-xs font-semibold">هنوز ثبت نام نکرده اید ؟ <a class="text-primary" href="./regester.html">ثبت نام</a></p>
    </aside>

    <aside class="flex flex-col justify-start gap-y-3 px-1.5 sx:px-10 pt-5">
      <div class="flex justify-center gap-3 mb-4">
        <button type="button" class="login-mode-password text-primary text-xs font-semibold">
          ورود با رمز عبور
        </button>
        <button type="button" class="login-mode-otp text-4E4E4E dark:text-white text-xs font-semibold">
          ورود با کد ایمیل
        </button>
      </div>

      <h3 class="number-or-email dark:text-white text-222223 py-3 text-xs font-semibold leading-6">
        ایمیل خود را وارد کنید
      </h3>

            <aside class="flex relative w-66">
                <input class="login-input w-full dark:border-C4C4C4 border-E1E1E1 border rounded-lg  h-12 leading-12 px-4 py-4 focus:outline-primary focus:caret-primary placeholder:text-xs placeholder:font-medium dark:placeholder:text-white" autocomplete="email" type="email" placeholder="آدرس ایمیل">
                <svg class="size-4 absolute left-4 top-4  dark:text-white text-737373">
                    <use href="#email"></use>
                </svg>
            </aside>
            <aside class="flex relative w-66">
                <input class="login-password-input password-input w-full dark:border-C4C4C4 border-E1E1E1 border rounded-lg  h-12 leading-12 px-4 py-4 focus:outline-primary focus:caret-primary placeholder:text-xs placeholder:font-medium dark:placeholder:text-white" autocomplete="current-password" minlength="8" maxlength="64" type="password" placeholder="رمز عبور  (حداقل 8 کارکتر و حداکثر 64)">
                <svg class="open-eye size-4 absolute left-4  dark:text-white top-4 text-737373">
                    <use href="#open-eye"></use>
                </svg>
                <svg class="close-eye hidden size-4 absolute left-4 top-4 text-737373">
                    <use href="#close-eye"></use>
                </svg>
            </aside>
      
      <!-- <img src="public/image/nyan_cat_transparent_stars.gif" alt=""> -->
      <aside dir="ltr" class="code-input hidden justify-center items-center gap-x-2.5 mt-4">
        <input class="size-10 text-center border-E1E1E1 border rounded-lg dark:border-C4C4C4 dark:placeholder:text-white focus:outline-primary" placeholder="-" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
        <input class="size-10 text-center border-E1E1E1 border rounded-lg dark:border-C4C4C4 dark:placeholder:text-white focus:outline-primary" placeholder="-" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
        <input class="size-10 text-center border-E1E1E1 border rounded-lg dark:border-C4C4C4 dark:placeholder:text-white focus:outline-primary" placeholder="-" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
        <input class="size-10 text-center border-E1E1E1 border rounded-lg dark:border-C4C4C4 dark:placeholder:text-white focus:outline-primary" placeholder="-" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
        <input class="size-10 text-center border-E1E1E1 border rounded-lg dark:border-C4C4C4 dark:placeholder:text-white focus:outline-primary" placeholder="-" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
        <input class="size-10 text-center border-E1E1E1 border rounded-lg dark:border-C4C4C4 dark:placeholder:text-white focus:outline-primary" placeholder="-" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
      </aside>
    </aside>

    <aside class="flex  justify-center py-5">
      <button class="login-btn dark:bg-white bg-222223 w-65  rounded-lg  h-12 leading-12 px-4 py-4 flex justify-center items-center">
        <p class="login-btn-text dark:text-222223 text-white text-sm font-medium">ادامه و ورود به حساب</p>
      </button>
    </aside>
  </div>
</section>
<section class="container flex items-center justify-center pt-5">
  <article>
    <p class="font-iranyekan text-sm text dark:text-white text-222223 font-normal">با عضویت در سایت <a class="text-primary" href="">قوانین</a> و ظوابط گلینو را پذیرفته ام</p>
  </article>
</section>
<script type="module" src="public/js/login.js"></script>
</body>

</html>
